name: Package plugins
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: ./gradlew --no-daemon packageAllPlugins
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN || github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: build/dist/*.zip
